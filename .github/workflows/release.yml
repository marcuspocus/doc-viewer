name: Release to npmjs

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/

      - name: Verify tag matches package version
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          test "$TAG" = "v$VERSION" || {
            echo "Tag $TAG does not match package version $VERSION" >&2
            exit 1
          }

      - name: Configure npmjs registry
        run: |
          set -euo pipefail
          npm --version
          npm config set registry https://registry.npmjs.org/
          npm config set @yieldcraft:registry https://registry.npmjs.org/
          echo "registry=$(npm config get registry)"
          echo "@yieldcraft:registry=$(npm config get @yieldcraft:registry)"
          npm view @yieldcraft/doc-viewer version \
            --registry=https://registry.npmjs.org/ \
            --@yieldcraft:registry=https://registry.npmjs.org/ || true

      - name: Validate package contents
        run: npm pack --dry-run

      - name: Publish to npmjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          publish_args=(
            --registry=https://registry.npmjs.org/
            --@yieldcraft:registry=https://registry.npmjs.org/
            --access public
          )

          set +e
          npm publish "${publish_args[@]}" --provenance 2>&1 | tee /tmp/npm-publish.log
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          if grep -q "TLOG_CREATE_ENTRY_ERROR" /tmp/npm-publish.log; then
            echo "npm provenance transparency-log entry already exists; retrying publish without provenance" >&2
            npm publish "${publish_args[@]}"
            exit 0
          fi

          exit "$status"